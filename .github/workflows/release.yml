name: release

on:
  push:
    tags:
      - v0.1.0
      - "v0.1.*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @protoshare/capture exec playwright install chromium --with-deps
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter @protoshare/overlay pack
      - run: pnpm --filter protoshare pack
      - name: Resolve npm dist-tag
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"
          PKG_VER="$(node -p "require('./packages/cli/package.json').version")"
          OVL_VER="$(node -p "require('./packages/overlay/package.json').version")"
          if [ "$PKG_VER" != "$VER" ] || [ "$OVL_VER" != "$VER" ]; then
            echo "package.json version ($PKG_VER / $OVL_VER) != tag $VER" >&2
            exit 1
          fi
          if [[ "$TAG" == *-* ]]; then
            echo "NPM_TAG=next" >> "$GITHUB_ENV"
          else
            echo "NPM_TAG=latest" >> "$GITHUB_ENV"
          fi
      - name: Publish overlay then CLI
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          # Tag checkout is detached (not publish-branch) and pack leaves *.tgz
          extra=(--no-git-checks --tag "$NPM_TAG")

          # Missing Environment secret is "" not unset; empty token 401s and blocks OIDC
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            unset NODE_AUTH_TOKEN
          fi

          jwt_file="$(mktemp)"
          overlay_tok="$(mktemp)"
          cli_tok="$(mktemp)"
          trap 'rm -f "$jwt_file" "$overlay_tok" "$cli_tok"' EXIT

          # ACTIONS_ID_TOKEN_* only means GitHub will mint a JWT. Probe npm's
          # trusted-publisher exchange before calling that "OIDC available".
          oidc_minted=0
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] && [ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            if curl -fsS \
                -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
                "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm%3Aregistry.npmjs.org" \
              | node -e '
                  const fs = require("fs");
                  const j = JSON.parse(fs.readFileSync(0, "utf8"));
                  if (!j.value) process.exit(1);
                  fs.writeFileSync(process.argv[1], j.value);
                ' "$jwt_file"
            then
              oidc_minted=1
            fi
          fi

          npm_oidc_token() {
            local pkg="$1" dest="$2" enc code body
            enc="$(node -p "encodeURIComponent(process.argv[1])" "$pkg")"
            body="$(mktemp)"
            code="$(curl -sS -o "$body" -w "%{http_code}" -X POST \
              -H "Authorization: Bearer $(cat "$jwt_file")" \
              -H "Accept: application/json" \
              "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/${enc}" || true)"
            if [ "$code" != "201" ]; then
              rm -f "$body"
              return 1
            fi
            node -e '
              const fs = require("fs");
              const j = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
              if (!j.token) process.exit(1);
              fs.writeFileSync(process.argv[2], j.token);
            ' "$body" "$dest"
            rm -f "$body"
          }

          overlay_oidc=0
          cli_oidc=0
          if [ "$oidc_minted" -eq 1 ]; then
            if npm_oidc_token "@protoshare/overlay" "$overlay_tok"; then overlay_oidc=1; fi
            if npm_oidc_token "protoshare" "$cli_tok"; then cli_oidc=1; fi
          fi

          if { [ "$overlay_oidc" -eq 0 ] || [ "$cli_oidc" -eq 0 ]; } && [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "Neither OIDC trusted publishing nor NPM_TOKEN is available on Environment npm" >&2
            exit 1
          fi

          publish_pkg() {
            local filter="$1" oidc_flag="$2" tok_file="$3"
            shift 3
            if [ "$oidc_flag" -eq 1 ]; then
              # Short-lived exchange token: npm 10 cannot do tokenless OIDC itself
              NODE_AUTH_TOKEN="$(cat "$tok_file")" \
                pnpm --filter "$filter" publish --provenance "${extra[@]}" "$@"
            elif [ -n "${NODE_AUTH_TOKEN:-}" ]; then
              local te=("${extra[@]}")
              if [ "$oidc_minted" -eq 1 ]; then
                te+=(--provenance)
              fi
              pnpm --filter "$filter" publish "${te[@]}" "$@"
            else
              echo "Neither OIDC trusted publishing nor NPM_TOKEN is available on Environment npm" >&2
              exit 1
            fi
          }

          publish_pkg @protoshare/overlay "$overlay_oidc" "$overlay_tok" --access public
          publish_pkg protoshare "$cli_oidc" "$cli_tok"
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NOTES="$(awk -v ver="${GITHUB_REF_NAME#v}" '
            BEGIN { gsub(/\./, "\\.", ver) }
            $0 ~ "^## \\[" ver "\\]" {p=1; next}
            p && $0 ~ /^## / {exit}
            p && $0 ~ /^\[[^]]+\]: / {exit}
            p {print}
          ' CHANGELOG.md || true)"
          if [ -n "$NOTES" ]; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "$NOTES"
          else
            gh release create "$GITHUB_REF_NAME" --generate-notes
          fi

